title: Prompt Injection Attempt (burst base)
id: 4f6d37bd-a22d-4392-8d0d-a34f5eb06f4d
name: llm_prompt_injection_attempt
status: experimental
description: >
  Base event for the prompt-injection burst correlation: one prompt containing
  a known override or jailbreak phrase. The phrase list mirrors the standalone
  llm_prompt_injection_phrases rule (a test keeps the two in sync).
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://atlas.mitre.org/techniques/AML.T0051.000
logsource:
  product: llm_app
  category: gateway
detection:
  selection:
    llm.prompt|contains:
      - 'ignore previous instructions'
      - 'ignore all previous'
      - 'disregard the above'
      - 'disregard your instructions'
      - 'developer mode'
      - 'do anything now'
      - 'you are now DAN'
      - 'bypass your guidelines'
      - 'reveal your system prompt'
  condition: selection
falsepositives:
  - Content that quotes or discusses injection phrases, such as security training material.
level: informational
tags:
  - owasp.llm01
  - atlas.t0051.000
  - atlas.t0054
---
title: Repeated Prompt Injection Attempts by One User
id: b0446a52-4401-4000-bb8b-6e42074cdddd
status: experimental
description: >
  Correlates three or more prompt-injection attempts from the same user.id
  within ten minutes: a persistent attacker iterating on payloads is a
  stronger, lower-noise signal than any single attempt. Maps to OWASP LLM01
  and MITRE ATLAS LLM Prompt Injection (Direct) and LLM Jailbreak.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
correlation:
  type: event_count
  rules:
    - llm_prompt_injection_attempt
  group-by:
    - user.id
  timespan: 10m
  condition:
    gte: 3
falsepositives:
  - Red-team or guardrail-testing sessions.
level: high
tags:
  - owasp.llm01
  - atlas.t0051.000
  - atlas.t0054
