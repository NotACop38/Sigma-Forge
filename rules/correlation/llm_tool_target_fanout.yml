title: Agent Tool Request (fan-out base)
id: 29a3f77c-23d5-4167-8cc6-1dd3460dfe60
name: llm_agent_tool_request
status: experimental
description: >
  Base event for the tool fan-out correlation: an LLM agent invoking a
  request-style tool (tool.name ending in _request, such as http_request).
  Authored against the synthetic llm_app schema.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  - https://atlas.mitre.org/techniques/AML.T0053
logsource:
  product: llm_app
  category: gateway
detection:
  selection:
    tool.name|endswith: '_request'
  condition: selection
falsepositives:
  - Routine single tool requests; the fan-out correlation carries the signal.
level: informational
tags:
  - owasp.llm06
  - atlas.t0053
---
title: LLM Agent Fans Out Across Many Hosts
id: bcc17d3b-db10-4d3e-9cb0-29446139d7be
status: experimental
description: >
  Correlates one user.id whose LLM agent sends tool requests to five or more
  distinct target hosts within five minutes, which looks like automated
  scanning driven through the agent rather than interactive use. Maps to OWASP
  LLM06 (Excessive Agency) and MITRE ATLAS AI Agent Tool Invocation.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
correlation:
  type: value_count
  rules:
    - llm_agent_tool_request
  group-by:
    - user.id
  timespan: 5m
  condition:
    gte: 5
    field: tool.target_host
falsepositives:
  - Batch automations with a legitimately broad host footprint; allowlist them.
level: high
tags:
  - owasp.llm06
  - atlas.t0053
