title: Scheduled Task Creation via schtasks
id: df34f6eb-4ed4-4c6e-bdaa-0814b2be8444
status: experimental
description: >
  Detects creation of a Windows scheduled task with schtasks.exe, a common
  mechanism for persistence, privilege escalation, and recurring execution.
  Authored from public MITRE ATT&CK references.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_cmd:
    CommandLine|contains: '/create'
  condition: selection_img and selection_cmd
falsepositives:
  - Software installers and administrators creating legitimate scheduled tasks.
level: medium
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
