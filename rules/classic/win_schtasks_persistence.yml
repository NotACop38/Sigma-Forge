title: Scheduled Task Creation via schtasks
id: df34f6eb-4ed4-4c6e-bdaa-0814b2be8444
status: experimental
description: >
  Detects creation of a Windows scheduled task via schtasks.exe, a common
  mechanism for persistence and recurring execution. Authored from public
  MITRE ATT&CK references.
author: sigma-forge
date: 2026-06-03
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_cmd:
    CommandLine|contains: '/create'
  condition: selection_img and selection_cmd
falsepositives:
  - Legitimate software and administrators creating scheduled tasks.
level: medium
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
