title: Certutil Download or Decode Activity
id: 21f411cb-b37f-454b-b802-9070f98ef31e
status: experimental
description: >
  Detects abuse of the living-off-the-land binary certutil.exe to download a
  remote file (-urlcache -f, or the -verifyctl variant) or to decode a
  previously staged payload (-decode), behaviour associated with ingress tool
  transfer and deobfuscation. Authored from public MITRE ATT&CK references.
author: sigma-forge
date: 2026-06-03
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1140/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_flags:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
      - '-decode'
      - '/decode'
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate certificate management or administrative file staging.
level: high
tags:
  - attack.command-and-control
  - attack.defense-evasion
  - attack.t1105
  - attack.t1140
