title: Encoded PowerShell Command Execution
id: 93fd6ce6-6e03-489c-ab1f-b7a96115bd5f
status: experimental
description: >
  Detects PowerShell executed with an encoded/Base64 command line
  (-EncodedCommand / -enc / -e) or in-line FromBase64String decoding, a common
  technique for obfuscating malicious script content. Authored from public
  MITRE ATT&CK references; not derived from any proprietary detection.
author: sigma-forge
date: 2026-06-03
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_enc:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
      - ' -e '
      - 'FromBase64String'
  condition: selection_img and selection_enc
falsepositives:
  - Administrative scripts that legitimately pass Base64-encoded commands.
level: high
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1027
