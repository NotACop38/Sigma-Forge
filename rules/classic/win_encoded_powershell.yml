title: Encoded PowerShell Command Execution
id: 93fd6ce6-6e03-489c-ab1f-b7a96115bd5f
status: experimental
description: >
  Detects PowerShell started with an encoded command line: -EncodedCommand or
  any abbreviation PowerShell accepts for it (-e, -ec, -en, -enc, -enco...),
  written with a hyphen, a slash, or a Unicode dash, or in-line Base64 decoding
  with FromBase64String. Encoding hides the script body from command-line
  review. Authored from public MITRE ATT&CK references.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/010/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|windash|contains:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco'
  selection_decode:
    CommandLine|contains: 'FromBase64String'
  condition: selection_img and (selection_encoded or selection_decode)
falsepositives:
  - Management agents and installers that pass Base64-encoded commands.
level: high
tags:
  - attack.execution
  - attack.stealth
  - attack.t1059.001
  - attack.t1027.010
