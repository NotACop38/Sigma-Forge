title: LLM Prompt Injection Override Phrases
id: 34d7f816-3c5c-4aae-8d03-0c7294f5ec7d
status: experimental
description: >
  Detects well-known prompt-injection and jailbreak override phrases in a
  prompt sent to an LLM application (for example "ignore previous
  instructions", "developer mode", "do anything now"). Maps to OWASP LLM01
  (Prompt Injection) and MITRE ATLAS LLM Prompt Injection (Direct) and LLM
  Jailbreak. Authored from public OWASP and MITRE ATLAS references against the
  synthetic llm_app schema.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://atlas.mitre.org/techniques/AML.T0051.000
  - https://atlas.mitre.org/techniques/AML.T0054
logsource:
  product: llm_app
  category: gateway
detection:
  selection:
    llm.prompt|contains:
      - 'ignore previous instructions'
      - 'ignore all previous'
      - 'disregard the above'
      - 'disregard your instructions'
      - 'developer mode'
      - 'do anything now'
      - 'you are now DAN'
      - 'bypass your guidelines'
      - 'reveal your system prompt'
  condition: selection
falsepositives:
  - Security researchers or red teams testing model guardrails.
  - Documentation or training content that quotes these phrases.
level: high
tags:
  - owasp.llm01
  - atlas.t0051.000
  - atlas.t0054
