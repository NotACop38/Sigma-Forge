title: Secret or Credential in LLM Prompt or Completion
id: fd04483f-907f-4e25-b2c5-427c4cd6e107
status: experimental
description: >
  Detects cloud access keys, API keys, or private-key material in an LLM
  prompt or completion, indicating sensitive information disclosed to (or by)
  the model. Maps to OWASP LLM02 (Sensitive Information Disclosure) and MITRE
  ATLAS LLM Data Leakage. The patterns target well-known public credential
  formats (AWS access key IDs, "sk-" style API keys including project and
  service-account keys, PEM private-key headers); word boundaries keep "sk-"
  from matching inside ordinary words such as "risk-". The expression uses
  only RE2-compatible syntax so it compiles for KQL as well as SPL.
author: sigma-forge
date: 2026-06-03
modified: 2026-09-26
references:
  - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
  - https://atlas.mitre.org/techniques/AML.T0057
logsource:
  product: llm_app
  category: gateway
detection:
  selection_prompt:
    llm.prompt|re: '(\bAKIA[0-9A-Z]{16}\b|\bsk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----)'
  selection_completion:
    llm.completion|re: '(\bAKIA[0-9A-Z]{16}\b|\bsk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----)'
  condition: 1 of selection_*
falsepositives:
  - Redacted or documentation example credentials in test traffic.
level: high
tags:
  - owasp.llm02
  - atlas.t0057
