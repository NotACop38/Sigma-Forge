title: Secret or Credential in LLM Prompt or Completion
id: fd04483f-907f-4e25-b2c5-427c4cd6e107
status: experimental
description: >
  Detects API keys, cloud access keys, or private-key material appearing in an
  LLM prompt or completion, indicating sensitive-information disclosure to (or
  from) the model. Maps to OWASP Top 10 for LLM Applications LLM02 (Sensitive
  Information Disclosure) and MITRE ATLAS LLM Data Leakage. Regex patterns target
  well-known PUBLIC credential formats; authored against the synthetic llm_app
  schema.
author: sigma-forge
date: 2026-06-03
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://atlas.mitre.org/techniques/AML.T0057
logsource:
  product: llm_app
  category: gateway
detection:
  selection_prompt:
    llm.prompt|re: '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
  selection_completion:
    llm.completion|re: '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
  condition: 1 of selection_*
falsepositives:
  - Redacted or example credentials used in documentation or test traffic.
level: high
tags:
  - attack.credential-access
  - owasp.llm02
  - atlas.t0057
