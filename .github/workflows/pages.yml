name: Pages

# Publishes the ATT&CK coverage site (heatmap + Navigator layer JSON) to GitHub
# Pages. Requires Pages to be enabled for the repo with "Source: GitHub Actions"
# (Settings -> Pages). Kept separate from CI so it never affects the CI badge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Build coverage site
        run: uv run sigma-forge coverage --site _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
