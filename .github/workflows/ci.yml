name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint • convert • fire-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. sigma backends + pipelines)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Confirm sigma plugins
        run: uv run --python ${{ matrix.python-version }} sigma list targets

      - name: Ruff (lint)
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      - name: Ruff (format check)
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests

      - name: Mypy (type check)
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Convert every rule to SPL and Sentinel/Defender KQL (fail on error)
        run: uv run --python ${{ matrix.python-version }} sigma-forge convert --all --check

      - name: Pytest (lint + convert goldens + fire-tests)
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Build ATT&CK Navigator layer + heatmap
        if: matrix.python-version == '3.11'
        run: uv run sigma-forge coverage --layer docs/attack-layer.json --png docs/images/attack-layer.png

      - name: Fail if the committed Navigator layer is stale
        if: matrix.python-version == '3.11'
        run: git diff --exit-code -- docs/attack-layer.json

      - name: Upload ATT&CK Navigator layer artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attack-navigator-layer
          path: docs/attack-layer.json

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm gitleaks.tgz
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
      - name: Canary — a planted secret in the fixture file must still be caught
        run: |
          # Guards against an over-broad allowlist (e.g. a path entry silently
          # exempting the whole secret-fixture file from scanning). The key is
          # assembled at runtime so this workflow file itself stays clean.
          tmp="$(mktemp -d)"
          cp -r sample_logs "$tmp/"
          canary="AKIA$(printf 'Q3EGRJ7V2NXM5K9C')"
          printf '{"llm.prompt": "canary aws_key=%s end"}\n' "$canary" \
            >> "$tmp/sample_logs/llm/llm_secret_in_prompt.positive.json"
          if gitleaks dir "$tmp" --config .gitleaks.toml --redact --exit-code 1 >/dev/null 2>&1; then
            echo "::error::gitleaks did not detect the planted canary secret — the allowlist is over-broad"
            exit 1
          fi
          echo "canary detected as expected"
