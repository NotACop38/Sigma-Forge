name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }} and locked dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --frozen

      - name: Ruff (lint and format)
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (branch coverage >= 90%)
        run: uv run pytest --cov

      - name: Rule gate (lint, convert, fire-test every rule)
        run: uv run sigma-forge check

      - name: Coverage artifacts are current
        run: uv run sigma-forge coverage --check

      - name: requirements.txt matches uv.lock
        if: matrix.python-version == '3.11'
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt || {
            echo "::error::requirements.txt is stale; run 'make requirements' and commit it"
            exit 1
          }

      - name: Wheel works outside the source tree
        if: matrix.python-version == '3.11'
        run: |
          uv build
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/sigma-forge" check --root "$GITHUB_WORKSPACE"

      - name: Upload the ATT&CK Navigator layer
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attack-navigator-layer
          path: docs/attack-layer.json

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so a secret deleted later still fails the scan
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm gitleaks.tgz
          gitleaks version
      - name: Scan the full git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
      - name: Canary - a planted secret in the fixture file must still be caught
        run: |
          # Guards against an over-broad allowlist (for example a path entry that
          # silently exempts the whole fixture file). The key is assembled at run
          # time so this workflow file stays clean.
          tmp="$(mktemp -d)"
          cp -r sample_logs "$tmp/"
          canary="AKIA$(printf 'Q3EGRJ7V2NXM5K9C')"
          printf '{"llm.prompt": "canary aws_key=%s end"}\n' "$canary" \
            >> "$tmp/sample_logs/llm/llm_secret_in_prompt.positive.json"
          if gitleaks dir "$tmp" --config .gitleaks.toml --redact --exit-code 1 >/dev/null 2>&1; then
            echo "::error::gitleaks missed the planted canary; the allowlist is over-broad"
            exit 1
          fi
          echo "canary detected as expected"
