[project]
name = "sigma-forge"
version = "0.1.0"
description = "Detection-as-code starter: Sigma -> Splunk SPL & Microsoft Sentinel KQL, fire-tested in CI, with MITRE ATT&CK + ATLAS coverage and an LLM/AI-app threat pack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sigma-forge" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
keywords = [
    "detection-engineering",
    "detection-as-code",
    "sigma",
    "splunk",
    "kql",
    "mitre-attack",
    "mitre-atlas",
    "llm-security",
]
dependencies = [
    "matplotlib>=3.10.9",
    "openai>=2.40.0",
    "pysigma>=1.3.3",
    "pysigma-backend-kusto>=1.0.1",
    "pysigma-backend-splunk>=2.1.0",
    "pysigma-pipeline-sysmon>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sigma-cli>=3.0.2",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/NotACop38/Sigma-Forge"
Repository = "https://github.com/NotACop38/Sigma-Forge"
Issues = "https://github.com/NotACop38/Sigma-Forge/issues"

[project.scripts]
sigma-forge = "sigmaforge.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmaforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: typer uses Argument()/Option() calls as parameter defaults by design.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
packages = ["sigmaforge"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
