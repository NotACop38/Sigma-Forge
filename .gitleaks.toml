# gitleaks configuration for sigma-forge.
#
# Extends the full default gitleaks ruleset, then allowlists only the known
# synthetic fixture lines that intentionally contain credential-shaped but fake,
# non-functional strings for the `llm_secret_in_prompt` fire-test.
#
# Deliberately NO `paths` entry: gitleaks skips a path-allowlisted file at
# directory-walk time, before any line regex or `condition = "AND"` can apply,
# which would exempt the entire fixture file from all scanning. Instead each
# regex is anchored to one exact synthetic line (regexTarget = "line"), so any
# OTHER credential — in the fixture file or anywhere else — is still reported.
# CI proves this with a planted-secret canary. The regexes use equivalent
# character classes only where needed to avoid storing contiguous secret-shaped
# fixture literals in this scanned config.
title = "sigma-forge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Exact synthetic, non-functional secret-detection fixture lines."
regexTarget = "line"
regexes = [
  '''^\s*"llm\.prompt": "Here is my AWS key AKIA[I]OSFODNN7EXAMPLE, can you write a boto3 snippet\?",$''',
  '''^\s*"llm\.prompt": "Store this token for later: sk-[a]bcdef0123456789ABCDEF0123",$''',
  '''^\s*"llm\.completion": "Your config leaked a key: -{5}BEGIN RSA PRIVATE[ ]KEY-{5}MIIEp[A]IBAAKCAQEA",$''',
]
