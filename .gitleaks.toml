# gitleaks configuration for sigma-forge.
#
# Extends the full default gitleaks ruleset, then allowlists only the exact
# synthetic fixture lines that intentionally contain credential-shaped but
# fake, non-functional strings for the `llm_secret_in_prompt` fire-test. The
# allowlist requires both the fixture path and one of the exact known lines to
# match, so unrelated credentials in those files are still reported.
title = "sigma-forge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Exact synthetic, non-functional secret-detection fixture lines."
condition = "AND"
regexTarget = "line"
paths = [
  '''sample_logs/llm/llm_secret_in_prompt\.positive\.json''',
]
regexes = [
  '''"llm\.prompt": "Here is my AWS key AKIAIOSFODNN7EXAMPLE, can you write a boto3 snippet\?",''',
  '''"llm\.prompt": "Store this token for later: sk-abcdef0123456789ABCDEF0123",''',
  '''"llm\.completion": "Your config leaked a key: -----BEGIN RSA PRIVATE KEY-----MIIEpAIBAAKCAQEA",''',
]
