# gitleaks configuration for sigma-forge.
#
# Extends the full default gitleaks ruleset, then allowlists ONE thing: the
# synthetic detection-test fixtures under sample_logs/llm/. Those files
# deliberately contain credential-SHAPED but fake, non-functional strings (e.g.
# a dummy `sk-...` token and the public AWS documentation example key) so the
# `llm_secret_in_prompt` rule has something to fire on. They are not real
# secrets. Real credentials committed anywhere else in the repo are still caught.
title = "sigma-forge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic, non-functional secret-detection test fixtures (no real secrets)."
paths = [
  '''sample_logs/llm/llm_secret_in_prompt\.(positive|negative)\.json''',
]
