<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="sigma-forge — detection-as-code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#80ffdb"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ce8ff"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glowPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2630" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#1f2630" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2b3340"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="emberGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- ambient glow behind the emblem -->
  <ellipse cx="112" cy="150" rx="170" ry="150" fill="url(#glowPool)"/>

  <!-- emblem: shield + forge spark -->
  <g transform="translate(112,150)">
    <!-- shield glow -->
    <path d="M0,-64 L58,-38 L58,22 C58,57 31,79 0,92 C-31,79 -58,57 -58,22 L-58,-38 Z"
          fill="url(#accent)" opacity="0.16" filter="url(#soft)"/>
    <!-- shield body -->
    <path d="M0,-64 L58,-38 L58,22 C58,57 31,79 0,92 C-31,79 -58,57 -58,22 L-58,-38 Z"
          fill="#0d1117" stroke="url(#accentV)" stroke-width="4"/>
    <!-- inner rim -->
    <path d="M0,-50 L45,-29 L45,18 C45,46 24,64 0,75 C-24,64 -45,46 -45,18 L-45,-29 Z"
          fill="none" stroke="#1d4d57" stroke-width="1.5" opacity="0.8"/>
    <!-- forge bolt -->
    <path d="M-20,-8 L4,-8 L-9,15 L18,15 L-14,52 L-3,20 L-24,20 Z"
          fill="url(#accent)" filter="url(#emberGlow)" opacity="0.9"/>
    <path d="M-20,-8 L4,-8 L-9,15 L18,15 L-14,52 L-3,20 L-24,20 Z"
          fill="url(#accent)"/>
  </g>

  <!-- ember sparks -->
  <g fill="#80ffdb" filter="url(#emberGlow)">
    <circle cx="186" cy="92" r="2.4" opacity="0.9"/>
    <circle cx="204" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="172" cy="208" r="2.0" opacity="0.8"/>
    <circle cx="208" cy="186" r="1.4" opacity="0.6"/>
  </g>

  <!-- wordmark glow -->
  <text x="214" y="138" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="82" font-weight="700" fill="#4cc9f0" opacity="0.25" filter="url(#soft)"
        letter-spacing="1">sigma-forge</text>

  <!-- wordmark -->
  <text x="214" y="138" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="82" font-weight="700" fill="#e6edf3" letter-spacing="1">
    sigma<tspan fill="url(#accent)">-forge</tspan>
  </text>

  <!-- tagline -->
  <text x="216" y="182" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
        font-size="25" fill="#8b949e" letter-spacing="0.5">
    detection-as-code &#8226; Sigma &#8594; Splunk SPL &amp; Sentinel KQL &#8226; proven in CI
  </text>

  <!-- pipeline ribbon -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="19" fill="#06131a" font-weight="700">
    <g filter="url(#emberGlow)" opacity="0.55">
      <rect x="216" y="216" width="120" height="38" rx="8" fill="#4cc9f0"/>
      <rect x="356" y="216" width="88"  height="38" rx="8" fill="#56d4c0"/>
      <rect x="464" y="216" width="134" height="38" rx="8" fill="#6ce0b0"/>
      <rect x="618" y="216" width="152" height="38" rx="8" fill="#80ffdb"/>
      <rect x="790" y="216" width="72"  height="38" rx="8" fill="#a0ffe6"/>
    </g>
    <rect x="216" y="216" width="120" height="38" rx="8" fill="#4cc9f0"/>
    <text x="276" y="241" text-anchor="middle">author</text>
    <rect x="356" y="216" width="88"  height="38" rx="8" fill="#56d4c0"/>
    <text x="400" y="241" text-anchor="middle">lint</text>
    <rect x="464" y="216" width="134" height="38" rx="8" fill="#6ce0b0"/>
    <text x="531" y="241" text-anchor="middle">convert</text>
    <rect x="618" y="216" width="152" height="38" rx="8" fill="#80ffdb"/>
    <text x="694" y="241" text-anchor="middle">fire-test</text>
    <rect x="790" y="216" width="72"  height="38" rx="8" fill="#a0ffe6"/>
    <text x="826" y="241" text-anchor="middle">CI</text>
  </g>
  <g fill="#4b5563" font-family="monospace" font-size="20" font-weight="700">
    <text x="343" y="242">&#8594;</text>
    <text x="451" y="242">&#8594;</text>
    <text x="605" y="242">&#8594;</text>
    <text x="777" y="242">&#8594;</text>
  </g>

  <!-- corner frame accents -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M18,30 L18,18 L30,18"/>
    <path d="M1170,18 L1182,18 L1182,30"/>
    <path d="M1182,270 L1182,282 L1170,282"/>
    <path d="M30,282 L18,282 L18,270"/>
  </g>
</svg>
