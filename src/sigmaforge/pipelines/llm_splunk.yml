# sigma-forge: Splunk processing pipeline for the synthetic `llm_app` logsource.
#
# 1. Scopes every query to an illustrative `llm:gateway` sourcetype. Besides
#    narrowing the search, this gives regex-only rules a base search: without it
#    pySigma emits a query that starts with `| rex`, which Splunk rejects.
# 2. Flattens the dotted llm_app field names (src/sigmaforge/llm_schema.py) to
#    the underscore names a JSON sourcetype would typically extract.
#
# The sourcetype and field names are a fictional, product-agnostic convention.
# Replace them with your own before deploying.
name: sigma-forge llm_app (Splunk)
priority: 10
transformations:
  - id: llm_scope_sourcetype
    type: add_condition
    conditions:
      sourcetype: "llm:gateway"
    rule_conditions:
      - type: logsource
        product: llm_app
  - id: llm_field_names
    type: field_name_mapping
    mapping:
      llm.prompt: llm_prompt
      llm.completion: llm_completion
      llm.prompt_tokens: llm_prompt_tokens
      llm.completion_tokens: llm_completion_tokens
      llm.model: llm_model
      user.id: user_id
      app.id: app_id
      request.source_ip: src_ip
      tool.name: tool_name
      tool.target_host: tool_target_host
    rule_conditions:
      - type: logsource
        product: llm_app
